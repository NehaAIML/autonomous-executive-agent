name: Daily Executive Email Digest

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate and Unpack Secrets
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GMAIL_CREDENTIALS" ] || [ -z "$GMAIL_TOKEN" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Missing required repository secrets."
            exit 1
          fi
          echo "$GMAIL_CREDENTIALS" > credentials.json
          echo "$GMAIL_TOKEN" > token.json
          echo "Secrets unpacked successfully."

      - name: Run Executive Email Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python email_agent.py
